<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наши моменты ✨</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="hearts-bg"></div>

  <nav class="progress" aria-label="Прогресс">
    <span class="progress-dot done"></span>
    <span class="progress-dot done"></span>
    <span class="progress-dot active"></span>
    <span class="progress-dot"></span>
    <span class="progress-dot"></span>
    <span class="progress-dot"></span>
  </nav>

  <main class="page page-tall">
    <div class="container container-wide">
      <article class="card">
        <p class="page-number">Страница 3 из 6</p>
        <h1>Наши <em>моменты</em></h1>
        <div class="divider"></div>

        <div class="memories">
          <figure class="memory memory-row">
            <div class="photo-frame">
              <img src="images/snow.jpg" alt="Каждая ночь с тобой">
            </div>
            <figcaption class="memory-caption">
              Каждая ночь с тобой прекрасна, как та
            </figcaption>
          </figure>

          <figure class="memory memory-row memory-row-reverse">
            <div class="photo-frame">
              <img src="images/night.jpg" alt="Наш первый выезд вдвоём">
            </div>
            <figcaption class="memory-caption">
              Наш первый выезд вдвоём, я запомнил это навсегда
            </figcaption>
          </figure>
        </div>
      </article>
    </div>
  </main>

  <div class="nav-buttons">
    <a href="page2.html" class="btn btn-secondary">← Назад</a>
    <a href="page4.html" class="btn btn-primary">Далее →</a>
  </div>

  <script src="js/hearts.js"></script>
</body>
</html>
